<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buy and sell readiness check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: phone-first single column, one question per screen; three agent-chosen layouts (Classic, Bold, Profile); dashboard = tabs for Leads, My page, Marketing kit. */
:root{
  --brand:#1e3a5f;
  --on-brand:#ffffff;
  --gold:#c9962b;
  --ink:#16202a;
  --muted:#5d6874;
  --paper:#f5f6f8;
  --card:#ffffff;
  --line:#e1e5ea;
  --brand-fg:var(--brand);
  --btn-bg:var(--brand);
  --brand-soft:color-mix(in srgb, var(--brand) 9%, #ffffff);
  --good:#1e7f48; --good-soft:#e3f3ea;
  --info:#2f5fa8; --info-soft:#e6eef9;
  --warn:#a86a12; --warn-soft:#fbf0dc;
  --bad:#b23b30;  --bad-soft:#f9e5e2;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e8ecf1; --muted:#9aa6b3; --paper:#0f141a; --card:#171e26; --line:#29323d;
    --brand-fg:color-mix(in srgb, var(--brand) 45%, #ffffff);
    --brand-soft:color-mix(in srgb, var(--brand) 30%, #171e26);
    --good:#5cc98a; --good-soft:#15301f; --info:#8db3ee; --info-soft:#18273d;
    --warn:#eab75a; --warn-soft:#352812; --bad:#f08b7f; --bad-soft:#3a1c18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e8ecf1; --muted:#9aa6b3; --paper:#0f141a; --card:#171e26; --line:#29323d;
  --brand-fg:color-mix(in srgb, var(--brand) 45%, #ffffff);
  --brand-soft:color-mix(in srgb, var(--brand) 30%, #171e26);
  --good:#5cc98a; --good-soft:#15301f; --info:#8db3ee; --info-soft:#18273d;
  --warn:#eab75a; --warn-soft:#352812; --bad:#f08b7f; --bad-soft:#3a1c18;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none !important}
a{color:var(--brand-fg)}

/* demo switcher */
.demo{background:#11161c;color:#f1f3f5;font-size:13px}
.demo .in{max-width:1080px;margin:0 auto;padding:6px 16px;display:flex;align-items:center;gap:10px;overflow-x:auto}
.demo span{opacity:.7;white-space:nowrap}
.demo a{color:#f1f3f5;text-decoration:none;padding:4px 10px;border-radius:999px;white-space:nowrap;font-weight:600}
.demo a[aria-current="page"]{background:#f1f3f5;color:#11161c}

/* product header */
.head{background:var(--card);border-bottom:1px solid var(--line)}
.head .in{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.ph{border-radius:50%;object-fit:cover;flex:none;display:block}
.ini{border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none}
.who-agent{min-width:0;margin-right:auto}
.who-agent b{display:block;font-size:16px;line-height:1.2}
.who-agent small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hlogo{max-height:34px;max-width:110px;object-fit:contain;flex:none}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;flex:none}
.lang button{border:0;background:transparent;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
/* Bold layout header */
.lay-bold .head{background:var(--brand);border-bottom-color:transparent;color:var(--on-brand)}
.lay-bold .who-agent small{color:var(--on-brand);opacity:.8}
.lay-bold .lang{border-color:color-mix(in srgb, var(--on-brand) 35%, transparent)}
.lay-bold .lang button{color:var(--on-brand);opacity:.8}
.lay-bold .lang button[aria-pressed="true"]{background:var(--on-brand);color:var(--brand);opacity:1}
.lay-bold .head .ini{background:var(--on-brand);color:var(--brand)}

/* tool shell */
.shell{max-width:1000px;margin:0 auto}
.side{display:none}
.col{max-width:620px;margin:0 auto;padding:24px 16px 40px}
@media (min-width:960px){
  .lay-profile .shell{display:grid;grid-template-columns:300px 1fr;gap:32px;padding:24px 16px 0}
  .lay-profile .side{display:block;position:sticky;top:20px;align-self:start}
  .lay-profile .col{margin:0;padding:0 0 40px}
  .lay-profile .pcard.inline{display:none}
}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--good);background:var(--good-soft);padding:5px 11px;border-radius:999px}
.start h1{font-size:clamp(30px,7vw,40px);font-weight:800;margin:16px 0 10px}
.start p.lede{color:var(--muted);margin:0 0 24px;font-size:18px}
.band{background:var(--brand);color:var(--on-brand);margin:-24px -16px 22px;padding:26px 16px 34px;border-radius:0 0 26px 26px}
.band p.lede{color:var(--on-brand);opacity:.85;margin-bottom:0}
.band .badge{background:color-mix(in srgb, var(--on-brand) 16%, transparent);color:var(--on-brand)}
@media (min-width:660px){.band{margin:0 0 22px;border-radius:24px;padding:30px 28px 34px}}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:22px}
.pc-top{display:flex;gap:14px;align-items:center}
.pc-top b{display:block;font-family:var(--display);font-size:21px;line-height:1.2}
.pc-top small{display:block;color:var(--muted);font-size:14px}
.pc-tag{margin:12px 0 0;font-size:16px}
.pc-act{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.pc-act a{text-decoration:none}
.pc-logo{display:block;max-height:44px;max-width:160px;object-fit:contain;margin-top:14px}
.side .pcard{margin:0}
.side .pc-top{flex-direction:column;align-items:flex-start}
.picks{display:grid;gap:12px}
.pick{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;width:100%}
.pick:hover{border-color:var(--brand-fg)}
.pick .ic{width:46px;height:46px;border-radius:12px;background:var(--brand-soft);color:var(--brand-fg);display:grid;place-items:center;flex:none}
.pick b{display:block;font-family:var(--display);font-size:19px}
.pick small{display:block;color:var(--muted);font-size:15px}
.pick .arrow{margin-left:auto;color:var(--muted);font-size:22px}

/* question */
.progress{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.progress .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--brand-fg);transition:width .25s}
.progress small{color:var(--muted);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.section-tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-fg);margin-bottom:8px}
.q h2{font-size:clamp(24px,5.6vw,30px);font-weight:800}
.q .hint{color:var(--muted);margin:8px 0 0}
.opts{display:grid;gap:10px;margin-top:22px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;font-weight:600;cursor:pointer;min-height:56px}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt[aria-pressed="true"]{border-color:var(--brand-fg);background:var(--brand-soft)}
.opt[aria-pressed="true"] .dot{border-color:var(--brand-fg)}
.opt[aria-pressed="true"] .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand-fg)}
.money{position:relative;margin-top:22px}
.money span{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:26px;color:var(--muted);font-family:var(--display);font-weight:800}
.money input{width:100%;font-family:var(--display);font-weight:800;font-size:30px;padding:14px 16px 14px 42px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);font-variant-numeric:tabular-nums}
.money input:focus{border-color:var(--brand-fg);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.navbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:6}
.navbar .in{max-width:620px;margin:0 auto;display:flex;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 20px;font-weight:700;font-size:17px;cursor:pointer;background:var(--btn-bg);color:var(--on-brand);white-space:nowrap;text-decoration:none}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.grow{flex:1}
.btn.small{padding:8px 14px;font-size:14px;border-radius:10px}
.linkbtn{background:none;border:0;color:var(--brand-fg);font-weight:700;cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}

/* results */
.res{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.card h2{font-size:21px;font-weight:800}
.card .sub{color:var(--muted);margin:6px 0 0;font-size:15px}
.scorecard{display:flex;gap:18px;align-items:center}
.ring{position:relative;flex:none}
.ring svg{display:block}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring b{font-family:var(--display);font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.ring small{display:block;color:var(--muted);font-size:11px}
.pill{display:inline-block;font-weight:700;font-size:13px;padding:4px 11px;border-radius:999px;white-space:nowrap}
.t-ready{background:var(--good-soft);color:var(--good)}
.t-close{background:var(--info-soft);color:var(--info)}
.t-build{background:var(--warn-soft);color:var(--warn)}
.t-start{background:var(--bad-soft);color:var(--bad)}
.scorecard h3{font-size:21px;margin:8px 0 4px}
.scorecard p{margin:0;color:var(--muted);font-size:15px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-fg);margin-bottom:10px}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0;padding-bottom:0}
.stat:first-child{padding-top:0}
.stat .k{font-weight:600}
.stat .k small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.stat .v{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.stat .v.neg{color:var(--bad)}
.bd{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.bd td{padding:7px 0;border-bottom:1px dashed var(--line)}
.bd td:last-child{text-align:right;white-space:nowrap}
.bd tr.total td{border-bottom:0;border-top:2px solid var(--ink);font-weight:700;padding-top:10px}
.programs{display:grid;gap:12px}
.prog{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding-left:12px;border-left:4px solid var(--line)}
.prog b{display:block}
.prog small{color:var(--muted);font-size:14px}
.prog.ok{border-color:var(--good)} .prog.maybe{border-color:var(--warn)} .prog.no{border-color:var(--bad)}
.prog .pill{font-size:12px}
.ok .pill{background:var(--good-soft);color:var(--good)}
.maybe .pill{background:var(--warn-soft);color:var(--warn)}
.no .pill{background:var(--bad-soft);color:var(--bad)}
.steps{margin:0;padding-left:22px;display:grid;gap:10px}
.cross{background:var(--brand-soft);border:1px solid color-mix(in srgb, var(--brand-fg) 25%, transparent)}
.cross b{font-family:var(--display);font-size:18px;display:block}
.cross p{margin:4px 0 14px;color:var(--muted)}
.fields{display:grid;gap:14px;margin-top:16px}
label.f,.f{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
.opt-l{color:var(--muted);font-weight:400}
input.t,textarea.t,select.t{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);font-size:17px}
input.t:focus,textarea.t:focus,select.t:focus{border-color:var(--brand-fg);outline:none}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--muted)}
.consent input{margin-top:2px;width:22px;height:22px;flex:none;accent-color:var(--brand)}
.err{color:var(--bad);font-size:14px;font-weight:600;margin:0;min-height:1.2em}
.thanks{background:var(--good-soft);color:var(--ink);border-radius:12px;padding:16px;font-weight:600}
details.assume summary{cursor:pointer;color:var(--muted);font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media (max-width:440px){.two{grid-template-columns:1fr}}
.foot-actions{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.fine{font-size:13px;color:var(--muted);margin:0;text-align:center}

/* dashboard */
.dash{max-width:1080px;margin:0 auto;padding:22px 16px 60px}
.dash-top h1{font-size:clamp(26px,5vw,34px);font-weight:800}
.dash-top p{color:var(--muted);margin:4px 0 0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand-fg)}
.exm{font-size:12px;font-weight:700;background:var(--warn-soft);color:var(--warn);padding:3px 9px;border-radius:999px;vertical-align:middle;white-space:nowrap}
.bar-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 16px}
@media (max-width:640px){.tiles{grid-template-columns:1fr 1fr}}
.tile{text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.tile[aria-pressed="true"]{box-shadow:0 0 0 2px var(--brand-fg)}
.tile .k{font-size:13px;color:var(--muted);font-weight:700}
.tile .v{font-family:var(--display);font-size:28px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.tile.ready{border-left-color:var(--good)} .tile.close{border-left-color:var(--info)} .tile.build{border-left-color:var(--warn)} .tile.start{border-left-color:var(--bad)}
.leads{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lrow{display:grid;grid-template-columns:2.2fr 1fr .7fr 1.2fr 1fr 1.6fr 1fr auto;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);font-size:15px}
.lrow:last-child{border-bottom:0}
.lrow.hd{background:var(--paper);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.lrow .nm b{display:block}
.lrow .nm small{color:var(--muted);font-size:13px;display:block;word-break:break-word}
.type{font-size:12px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap;background:var(--paper);border:1px solid var(--line)}
.type.both{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.score{font-weight:800;font-variant-numeric:tabular-nums}
.lbl{display:none}
.cbox{display:flex;align-items:center;gap:6px;font-size:14px}
.cbox input{width:18px;height:18px;accent-color:var(--brand)}
@media (max-width:900px){
  .lrow.hd{display:none}
  .lrow{grid-template-columns:1fr 1fr;gap:8px 14px;padding:16px}
  .lrow .nm,.lrow .act{grid-column:1 / -1}
  .lrow .act .btn{width:100%}
  .lbl{display:block;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
}
.golive{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
@media (max-width:820px){.golive{grid-template-columns:1fr}}
.golive h3{font-size:17px;margin:4px 0 6px}
.golive p{margin:0;color:var(--muted);font-size:15px}
.golive .n{font-family:var(--display);font-weight:800;color:var(--brand-fg);font-size:13px}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* My page */
.pg{display:grid;gap:16px}
.pg h2{font-size:19px;margin-bottom:4px}
.pg .sub{color:var(--muted);margin:0 0 14px;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.uploads{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.uploads{grid-template-columns:1fr}}
.up{border:1.5px dashed var(--line);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center}
.up .prev{width:64px;height:64px;border-radius:12px;background:var(--paper);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--muted);font-size:12px;text-align:center}
.up .prev img{width:100%;height:100%;object-fit:cover}
.up .prev.logo img{object-fit:contain}
.up label.btn{cursor:pointer}
.up input{position:absolute;width:1px;height:1px;opacity:0}
.colorbox{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start}
@media (max-width:600px){.colorbox{grid-template-columns:1fr;justify-items:center}}
.wheel{position:relative;width:240px;height:240px;touch-action:none}
.wheel canvas{display:block;border-radius:50%;cursor:crosshair}
.wheel .mk{position:absolute;width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);transform:translate(-50%,-50%);pointer-events:none}
.ctrls{display:grid;gap:12px;width:100%}
.ctrls input[type=range]{width:100%;accent-color:var(--brand)}
.prevrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prevbtn{display:inline-flex;padding:10px 16px;border-radius:10px;background:var(--brand);color:var(--on-brand);font-weight:700}
.contrast{font-size:14px;color:var(--muted)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.themes{display:flex;gap:8px;flex-wrap:wrap}
.theme{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:999px;padding:5px 6px 5px 6px;background:var(--card)}
.theme button.apply{display:inline-flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;font-weight:700;font-size:14px;padding:0 4px 0 0}
.theme i{width:22px;height:22px;border-radius:50%;display:block}
.theme button.del{border:0;background:var(--paper);border-radius:50%;width:24px;height:24px;cursor:pointer;color:var(--muted);font-size:14px;line-height:1}
.layouts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
@media (max-width:640px){.layouts{grid-template-columns:1fr}}
.lay{border:2px solid var(--line);border-radius:16px;padding:12px;background:var(--card);cursor:pointer;text-align:left}
.lay[aria-pressed="true"]{border-color:var(--brand-fg);box-shadow:0 0 0 3px var(--brand-soft)}
.lay b{display:block;margin-top:10px}
.lay small{color:var(--muted);font-size:14px}
.mini{height:110px;border-radius:10px;background:var(--paper);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;gap:6px;padding:8px}
.mini i{display:block;border-radius:4px;background:var(--line)}
.mini .hb{height:14px;background:var(--card);border:1px solid var(--line)}
.mini .hb.br{background:var(--brand);border-color:var(--brand)}
.mini .bd2{height:34px;background:var(--brand);border-radius:8px}
.mini .ln{height:8px;width:70%}
.mini .ln.s{width:45%}
.mini .row{display:flex;gap:6px;flex:1}
.mini .row .sd{width:34%;background:var(--card);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:4px}
.mini .row .sd u{width:22px;height:22px;border-radius:50%;background:var(--brand);display:block}
.mini .row .mn{flex:1;display:flex;flex-direction:column;gap:6px}
.mini.mformal{background:#14171d;border-color:#14171d;align-items:center;gap:5px}
.mini.mformal .mc{width:20px;height:20px;border-radius:50%;border:2px solid var(--gold);display:block;background:#2a2f38}
.mini.mformal .ln{background:rgba(255,255,255,.35);height:6px}
.mini.mformal .mb{height:9px;width:78%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}
.mini.mformal .mrow{display:flex;gap:5px;width:78%}
.mini.mformal .mg{flex:1;height:10px;background:var(--gold)}
.mini.mformal .mo{flex:1;height:10px;background:transparent;border:1px solid rgba(255,255,255,.6)}

/* Marketing kit */
.kit-intro{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.kit-intro p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.kl-switch{display:flex;align-items:center;gap:4px;border:2px solid var(--brand);border-radius:999px;padding:3px;background:#fff;flex:none}
.kl-switch span{font-size:13px;font-weight:700;color:var(--muted);padding:0 6px 0 10px}
.kl-switch button{border:0;background:transparent;border-radius:999px;padding:9px 16px;font-size:16px;font-weight:800;cursor:pointer;color:var(--ink,#1a1a1a);min-height:44px}
.kl-switch button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand,#fff)}
.kit-main{margin-top:12px}
.kit-main .btn{flex:1 1 auto}
.kl-note{margin:-4px 0 14px;font-size:14px;color:var(--muted)}
.posts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.posts{grid-template-columns:1fr}}
.post{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;align-content:start}
.post h3{font-size:17px}
.post .num{font-size:12px;font-weight:700;color:var(--brand-fg);letter-spacing:.05em;text-transform:uppercase}
.post .imgwrap{background:var(--paper);border-radius:12px;display:grid;place-items:center;padding:10px;min-height:200px}
.post img.pv{max-width:100%;max-height:340px;border-radius:8px;display:block;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.post .cap{white-space:pre-wrap;font-size:14px;background:var(--paper);border-radius:12px;padding:12px;max-height:220px;overflow:auto}
.post .acts{display:flex;gap:8px;flex-wrap:wrap}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;background:var(--paper);border-radius:12px;padding:10px}
.th{position:relative;aspect-ratio:1;border:2px solid transparent;border-radius:10px;padding:0;overflow:hidden;cursor:pointer;background:var(--card)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.on{border-color:var(--brand-fg);box-shadow:0 0 0 2px var(--brand-soft)}
.adtag{position:absolute;left:3px;bottom:3px;background:#1e7f48;color:#fff;font-size:9px;font-weight:800;letter-spacing:.04em;padding:1px 4px;border-radius:4px}
.adnote{margin:0;font-size:13px;color:var(--muted)}
.adnote.ok{color:var(--good);font-weight:600}
.adnote.warn{color:var(--warn);font-weight:600}
.up-th{display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--brand-fg);border:2px dashed var(--line)}
.up-th input{position:absolute;width:1px;height:1px;opacity:0}
.post canvas.pv{max-width:100%;max-height:340px;border-radius:8px}
.vidcv{display:block;height:58vh;max-height:620px;width:auto;max-width:100%;margin:12px auto 0;border-radius:14px;background:#000;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.vbar{height:6px;background:var(--line);border-radius:3px;margin-top:12px;overflow:hidden}
.vbar i{display:block;height:100%;width:0;background:var(--brand,#1e3a5f);transition:width .2s linear}
.btn.vidbtn{background:#f1c45a;color:#1a1406;border-color:#f1c45a}

.legal{border-top:1px solid var(--line);background:var(--card);margin-top:8px}
.legal .in{max-width:1000px;margin:0 auto;padding:22px 16px 28px;display:grid;gap:8px;font-size:14px;color:var(--muted);text-align:center}
.legal p{margin:0}
.legal .req{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px}
.legal .who{color:var(--ink);font-weight:600}
.legal a{color:var(--brand-fg)}
.legal .pw{font-size:12px;opacity:.8}
.has-nav .legal .in{padding-bottom:110px}
.eho{display:inline-flex;gap:4px;align-items:center;vertical-align:middle}
.doc h1{font-size:clamp(28px,6vw,34px);margin:12px 0 4px}
.doc h2{font-size:18px;margin:22px 0 6px}
.doc p{margin:0;max-width:65ch}
.doc .upd{color:var(--muted);font-size:14px}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.checklist li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.checklist .ic{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px}
.checklist .ok .ic{background:var(--good-soft);color:var(--good)}
.checklist .no .ic{background:var(--warn-soft);color:var(--warn)}
.checklist small{display:block;color:var(--muted)}
.cbx{display:flex;gap:10px;align-items:center;font-weight:600}
.cbx input{width:20px;height:20px;accent-color:var(--brand)}
.hero{position:relative;background-color:#2a3440;background-size:cover;background-repeat:no-repeat;color:#fff;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(40,24,10,.20) 0%,rgba(40,24,10,.34) 34%,rgba(32,20,10,.62) 72%,rgba(26,18,10,.80) 100%)}
.lay-bold .hero::before{background:linear-gradient(180deg,rgba(12,18,26,.08) 0%,color-mix(in srgb,var(--brand) 45%,transparent) 42%,color-mix(in srgb,var(--brand) 92%,transparent) 100%)}
.hero .in{max-width:1000px;margin:0 auto;min-height:460px;padding:40px 16px 64px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px}
@media (min-width:760px){.hero .in{min-height:520px;padding:56px 24px 76px}}
.hero h1{font-size:clamp(32px,7.5vw,52px);font-weight:800;max-width:16ch;margin:0;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.hero .lede{margin:0;font-size:18px;max-width:46ch;color:rgba(255,255,255,.92);text-shadow:0 1px 8px rgba(0,0,0,.35)}
.greet{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;background:rgba(255,255,255,.94);color:#16202a;border-radius:999px;padding:5px 16px 5px 5px;font-weight:600;font-size:15px;max-width:100%;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.greet .ph,.greet .ini{border:2px solid #fff}
.trust{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px}
.trust li{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 14px rgba(0,0,0,.55)}
.trust svg{color:#7fe3a0;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7));flex:none}
.picks.lifted{margin-top:-60px;position:relative}
.pcard.lifted-card{margin-top:-60px;position:relative;box-shadow:0 10px 28px rgba(16,24,40,.16);border-color:transparent}
.picks.lifted .pick{box-shadow:0 10px 28px rgba(16,24,40,.14);border-color:transparent}
@media (min-width:960px){.lay-profile .picks.lifted{margin-top:0}}
.speaks{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:none;border:0;padding:0;font-size:16px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 16px rgba(0,0,0,.6)}
.speaks svg{filter:drop-shadow(0 1px 4px rgba(0,0,0,.5))}
.speaks.plain{color:var(--muted);text-shadow:none;margin:-10px 0 20px}
.band .speaks.plain{background:color-mix(in srgb,var(--on-brand) 16%,transparent);color:var(--on-brand);margin:14px 0 0}
.pc-langs{display:flex!important;align-items:center;gap:5px;color:var(--brand-fg)!important;font-weight:600}

/* ===== Call + Get in touch (every layout) ===== */
.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 0}
.cta-row .btn{flex:1 1 200px;min-height:52px;font-size:17px}
.btn.cta-call{background:var(--btn-bg);color:var(--on-brand)}
.touch{margin-top:34px;padding:24px 20px;background:var(--card);border:1px solid var(--line);border-radius:18px;scroll-margin-top:16px}
.touch h2{font-size:26px;margin:0 0 6px}
.touch > p{margin:0 0 16px;color:var(--muted)}
.touch form{display:grid;gap:12px}
.touch .two{display:grid;gap:12px}
@media (min-width:560px){.touch .two{grid-template-columns:1fr 1fr}}
.touch label.f{display:block;font-weight:700;font-size:15px;margin-bottom:5px}
.touch input.t,.touch textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper);font-size:17px}
.touch textarea{min-height:96px;resize:vertical}
.touch .consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted)}
.touch .consent input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--brand)}
.touch .err{color:var(--bad);font-weight:600;margin:0;min-height:0}
.touch .done{font-size:18px;font-weight:600;color:var(--good);margin:0}


/* ===== Post calendar ===== */
.cal-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.cal-card h2{font-size:21px;margin:0 0 4px}
.cal-card .sub{color:var(--muted);margin:0 0 14px;font-size:15px}
.cal-q{margin:14px 0 6px;font-weight:700;font-size:15px}
.daypick,.cal-opts{display:flex;flex-wrap:wrap;gap:6px}
.daypick button,.cal-opts button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px;cursor:pointer;min-height:42px;color:var(--ink)}
.daypick button[aria-pressed="true"],.cal-opts button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-head h3{font-size:19px;margin:0}
.cal-head button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;width:42px;height:42px;font-size:20px;cursor:pointer;color:var(--ink)}
.cal-head button:disabled{opacity:.35;cursor:default}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cgrid .wd{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding-bottom:2px}
.cday{min-height:52px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;cursor:pointer;color:var(--ink)}
.cday.blank{visibility:hidden}
.cday.past{opacity:.55}
.cday.today{border:2px solid var(--gold)}
.cday[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand-fg)}
.cday .dot{width:9px;height:9px;border-radius:50%;background:var(--brand-fg)}
.cday.done .dot{background:var(--good)}
.cday .lg{font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--muted)}
.cal-key{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.cal-key i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--brand-fg);margin-right:5px;vertical-align:middle}
.cal-key i.g{background:var(--good)}
.cal-day h3{font-size:20px;margin:2px 0 8px}
.cal-day .when{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cal-day .pvw{max-width:260px;border-radius:12px;display:block;margin:10px 0;border:1px solid var(--line)}
.cal-day .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cal-day .posted{color:var(--good);font-weight:700}
.cal-go{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.cal-go a,.cal-go button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-weight:700;font-size:15px;cursor:pointer;text-align:left}
.cal-go small{font-weight:600;color:var(--muted);font-size:12px}
.cal-go a:hover,.cal-go button:hover{border-color:var(--brand-fg)}
.cal-tip{font-size:14px;color:var(--muted);margin:12px 0 0}
.cal-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.cal-list li button{width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;cursor:pointer;color:var(--ink);font-size:15px}
.cal-list .dt{font-weight:800;min-width:86px;font-size:14px;color:var(--muted)}
.cal-list .ok{margin-left:auto;color:var(--good);font-weight:800}


/* ===== Photo frames (Formal layout) ===== */
.pf{position:relative;display:block;overflow:hidden;background:#1c2027;margin:0 auto}
.pf img{display:block;width:100%;height:100%;object-fit:cover}
.pf-circle{width:140px;height:140px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 12px 34px rgba(0,0,0,.45)}
.pf-oval{width:150px;height:188px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 12px 34px rgba(0,0,0,.45)}
.pf-square{width:156px;height:156px;border-radius:6px;border:3px solid var(--gold);box-shadow:0 12px 34px rgba(0,0,0,.45)}
.pf-rect{width:164px;height:205px;border-radius:4px;border:2px solid var(--gold);outline:1px solid color-mix(in srgb,var(--gold) 55%,transparent);outline-offset:6px;box-shadow:0 14px 36px rgba(0,0,0,.5);overflow:hidden}
.pf-arch{width:164px;height:205px;border-radius:82px 82px 6px 6px;border:3px solid var(--gold);box-shadow:0 12px 34px rgba(0,0,0,.45)}
.pf-soft-oval,.pf-soft-square,.pf-soft-rect{background:transparent}
.pf-soft-oval{width:200px;height:250px;-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 58%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 58%,transparent 100%)}
.pf-soft-square,.pf-soft-rect{-webkit-mask-image:linear-gradient(to right,transparent 0,#000 18%,#000 82%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 18%,#000 82%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent 0,#000 18%,#000 82%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 18%,#000 82%,transparent 100%);mask-composite:intersect}
.pf-soft-square{width:210px;height:210px}
.pf-soft-rect{width:210px;height:262px}
@media (min-width:760px){.pf-soft-oval{width:230px;height:288px}.pf-soft-square{width:240px;height:240px}.pf-soft-rect{width:236px;height:295px}.pf-rect,.pf-arch{width:180px;height:225px}.pf-arch{border-radius:90px 90px 6px 6px}}

/* Logo beside the photo on the Formal page */
.fph.with-logo{display:flex;align-items:center;justify-content:center;gap:22px;max-width:100%}
.fph .pf,.fph .ini{flex:none}
.logo-plate{flex:0 1 auto;background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 10px 26px rgba(0,0,0,.4);display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--gold) 45%,transparent)}
.logo-plate img{display:block;max-width:150px;max-height:84px;object-fit:contain}
@media (max-width:520px){.fph.with-logo{gap:12px}.logo-plate{padding:8px 9px;border-radius:10px}.logo-plate img{max-width:92px;max-height:58px}}
.logo-pos{margin-top:12px}
.logo-pos p{margin:0 0 6px;font-size:14px;font-weight:700}

/* ===== Photo editor (crop + frame) ===== */
.crop-ov{position:fixed;inset:0;z-index:60;background:rgba(8,10,14,.72);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px}
.crop-box{background:var(--card);color:var(--ink);border-radius:18px;width:100%;max-width:560px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.4);margin:auto 0}
.crop-box h2{font-size:22px;margin:0 0 4px}
.crop-box .sub{color:var(--muted);margin:0 0 14px;font-size:15px}
.crop-stage{background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb, var(--brand) 38%, #15181e) 0%,color-mix(in srgb, var(--brand) 18%, #0b0d11) 70%);border-radius:14px;padding:26px 12px;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
.crop-win{position:relative;overflow:hidden;cursor:grab;touch-action:none;background:#1c2027}
.crop-win.drag{cursor:grabbing}
.crop-win img{position:absolute;max-width:none;pointer-events:none;user-select:none;-webkit-user-drag:none}
.crop-win.plain{border:2px solid #fff;box-shadow:0 0 0 2000px rgba(0,0,0,0)}
.crop-zoom{display:flex;align-items:center;gap:10px;margin:14px 0 4px}
.crop-zoom input{flex:1;accent-color:var(--brand)}
.crop-zoom span{font-size:20px;color:var(--muted);width:20px;text-align:center}
.crop-frames{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.crop-frames button{border:2px solid var(--line);background:#14171d;border-radius:12px;padding:8px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:#e9ecf1;font-size:12px;font-weight:700;min-height:96px}
.crop-frames button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 40%,transparent)}
.crop-frames .mini-f{transform:scale(.3);transform-origin:center;margin:-70px -60px}
.crop-acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.crop-acts .btn{flex:1 1 140px}
.frame-line{margin:10px 0 0;font-size:14px;color:var(--muted)}

/* ===== Formal layout ===== */
.lay-formal{--f-bg:color-mix(in srgb, var(--brand) 18%, #0b0d11);--f-line:rgba(255,255,255,.14)}
.lay-formal .head{background:var(--f-bg);border-bottom-color:var(--f-line);color:#fff}
.lay-formal .who-agent small{color:rgba(255,255,255,.72)}
.lay-formal .lang{border-color:var(--f-line)}
.lay-formal .lang button{color:rgba(255,255,255,.75)}
.lay-formal .lang button[aria-pressed="true"]{background:#fff;color:#11141a}
.lay-formal .head .ini{background:var(--gold);color:#16120a}
.lay-formal .col h1,.lay-formal .col h2,.lay-formal .touch h2{font-family:var(--serif);font-weight:700;letter-spacing:-.01em}
.fhero{background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb, var(--brand) 38%, #15181e) 0%,var(--f-bg) 62%);color:#fff;text-align:center;position:relative;isolation:isolate;overflow:hidden}

.fhero h1 em{font-style:normal;color:var(--gold)}
.fhero .flede{margin:0;font-size:18px;color:rgba(255,255,255,.82);max-width:44ch}
.fhero .fwho{margin:0;font-size:15px;color:rgba(255,255,255,.7);letter-spacing:.02em}
.fhero .speaks{align-self:center;text-shadow:none;color:rgba(255,255,255,.86);font-size:15px}
.fhero .picks{width:100%;max-width:520px;margin-top:10px;gap:10px}
.fhero .pick{background:rgba(255,255,255,.055);border:1px solid var(--f-line);color:#fff;border-radius:12px;padding:15px 16px}
.fhero .pick:hover{border-color:color-mix(in srgb, var(--gold) 70%, transparent);background:rgba(255,255,255,.08)}
.fhero .pick .ic{background:rgba(201,150,43,.14);color:var(--gold);border-radius:10px}
.fhero .pick small{color:rgba(255,255,255,.66)}
.fhero .pick .arrow{color:rgba(255,255,255,.55)}
.fhero .cta-row{width:100%;max-width:520px;margin-top:8px}
.fhero .btn.cta-call{background:var(--gold);color:#16120a}
.fhero .btn.ghost{color:#fff;border-color:rgba(255,255,255,.55)}
.fhero .btn.ghost:hover{border-color:#fff;background:rgba(255,255,255,.06)}
.fhero .trust{justify-content:center;margin-top:10px}
.fhero .trust li{font-size:14px;font-weight:600;color:rgba(255,255,255,.75);text-shadow:none}
.fhero .trust svg{color:var(--gold);filter:none}

.ms{position:relative}
.ms summary{list-style:none;cursor:pointer;padding:12px 40px 12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);font-size:16px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms summary::-webkit-details-marker{display:none}
.ms summary::after{content:"▾";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.ms[open] summary::after{content:"▴"}
.ms-panel{margin-top:6px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:10px;max-height:340px;overflow:auto}
.ms-opt{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:8px;cursor:pointer;font-size:15px}
.ms-opt:hover{background:var(--paper)}
.ms-opt input{width:20px;height:20px;accent-color:var(--brand);flex:none}
.lang-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lchip{background:var(--brand-soft);color:var(--brand-fg);font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px}
select.t{appearance:auto}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,14,20,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.open{display:flex}
.modal .card{width:100%;max-width:560px;border-radius:18px 18px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media (min-width:640px){.modal{align-items:center;padding:16px}.modal .card{border-radius:18px}}
.modal .to{font-size:14px;color:var(--muted);margin-top:8px;word-break:break-word}
.modal textarea{min-height:170px;margin-top:6px}
.modal .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.modal .row > *{flex:1 1 140px}
.modal .note{font-size:13px;color:var(--muted);margin:12px 0 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;display:none;z-index:30}
.toast.show{display:block}
@media (prefers-reduced-motion: reduce){ .progress .bar i{transition:none} }

function hexToRgb(h){ h=h.replace("#",""); if(h.length===3) h=h.split("").map(function(c){return c+c;}).join(""); var n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function rgbToHex(r,g,b){ return "#"+[r,g,b].map(function(x){ x=Math.max(0,Math.min(255,Math.round(x))); return (x<16?"0":"")+x.toString(16); }).join(""); }
function hsvToRgb(h,s,v){ var f=function(n){ var k=(n+h/60)%6; return v-v*s*Math.max(Math.min(k,4-k,1),0); }; return [f(5)*255,f(3)*255,f(1)*255]; }
function rgbToHsv(r,g,b){ r/=255;g/=255;b/=255; var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h=0;
  if(d){ if(mx===r) h=((g-b)/d)%6; else if(mx===g) h=(b-r)/d+2; else h=(r-g)/d+4; h*=60; if(h<0) h+=360; }
  return [h, mx?d/mx:0, mx]; }
function lum(hex){ var c=hexToRgb(hex).map(function(v){ v/=255; return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4); }); return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]; }
function contrastWhite(hex){ return 1.05/(lum(hex)+0.05); }
function validHex(h){ return /^#?[0-9a-fA-F]{6}$/.test(h); }

function pf(rate){ var r=rate/100/12,n=360; return r===0?1/n:r/(1-Math.pow(1+r,-n)); }

function buyer(a,extraCash){
  var list=programs(a.b_credit,a.b_mil==="yes"), s=CREDIT_MID[a.b_credit], first=(a.b_own==="rent");
  var best= list[0].fit!=="no" ? {key:"va",down:0,mi:0} : s>=680 ? {key:"conv",down:first?0.03:0.05,mi:0.005} : {key:"fha",down:s>=580?0.035:0.10,mi:0.0055};
  var savings=a.b_savings+(extraCash||0);

  var mi=a.b_income/12, pay=a.b_price*per, dti=mi>0?(pay+a.b_debts)/mi:9;

  var score=Math.round(CREDIT_PTS[a.b_credit] + (mi<=0?0:dti<=0.36?30:dti<=0.43?24:dti<=0.5?12:3) + (ratio>=1?20:ratio>=0.6?13:ratio>=0.3?7:2) + JOB_PTS[a.b_job]);

  LANGS.forEach(function(L){ if(sel.indexOf(L[0])>=0) out.push({code:L[0],native:L[1],en:L[2],es:L[3]}); });
  String(settings.langsOther||"").split(",").map(function(x){return x.trim();}).filter(Boolean).forEach(function(x){ out.push({code:"x-"+x.toLowerCase(),native:x,en:x,es:x}); });
  if(!out.length) out.push({code:"en",native:"English",en:"English",es:"inglés"});
  return out;
}
function speaksMore(){ var a=agentLangs(); return a.length>1 || a[0].code!=="en"; }
function hasLang(c){ return agentLangs().some(function(x){return x.code===c;}); }
function langNative(){ return agentLangs().map(function(x){return x.native;}).join(" · "); }
function joinWords(arr,l){ if(arr.length<2) return arr.join(""); var and=l==="es"?" y ":" and "; return arr.slice(0,-1).join(", ")+and+arr[arr.length-1]; }
function speakSentence(l){ if(!speaksMore()) return ""; var names=agentLangs().map(function(x){return l==="es"?x.es:x.en;}); return (l==="es"?"Hablo ":"I speak ")+joinWords(names,l)+"."; }
function langByCode(c){ var a=agentLangs(); for(var i=0;i<a.length;i++) if(a[i].code===c) return a[i]; for(var j=0;j<LANGS.length;j++) if(LANGS[j][0]===c) return {code:c,native:LANGS[j][1],en:LANGS[j][2],es:LANGS[j][3]}; return null; }

function touchCard(t){ var ag=agentName();

function submitTouch(){
  var t=L(), ag=agentName(), g=function(id){ var el=document.getElementById(id); return el?el.value.trim():""; }, err=document.getElementById("tErr");
  var n=g("tName"), ph=g("tPhone"), em=g("tEmail"), msg=g("tMsg"), ok=document.getElementById("tOk").checked;
  if(!n){ err.textContent=t.errName; document.getElementById("tName").focus(); return; }
  if(!ph&&!em){ err.textContent=fill(t.errReach,{agent:ag}); document.getElementById("tPhone").focus(); return; }
  if(ph && ph.replace(/[^0-9]/g,"").length<10){ err.textContent=t.errPhone; document.getElementById("tPhone").focus(); return; }
  if(em && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ err.textContent=t.errEmail; document.getElementById("tEmail").focus(); return; }
  if(!ok){ err.textContent=fill(t.errConsent,{agent:ag}); document.getElementById("tOk").focus(); return; }
  err.textContent="";
  var btn=document.querySelector('#touchForm button[type="submit"]'); if(btn) btn.disabled=true;
  var lead={type:"other",via:"contact",name:n,phone:ph,email:em,msg:msg,lang:lang,pref:lang,consentAt:new Date().toISOString()};
  sendTouch(lead,function(good){
    if(!good){ if(btn) btn.disabled=false; err.textContent=t.touchFail; return; }
    st.touchDone=fill(t.touchThanks,{name:n.split(" ")[0],agent:ag});
    var c=document.getElementById("touch"); if(c) c.outerHTML=touchCard(t);
  });
}

function advance(){ if(st.screen!=="q") return; if(st.i<FLOWS[st.flow].length-1){ st.i++; } else { st.screen="results"; } render(); }

function ring(score,tier,size){
  var r=size/2-9, C=2*Math.PI*r, col={ready:"var(--good)",close:"var(--info)",build:"var(--warn)",start:"var(--bad)"}[tier];
  return '<div class="ring" style="width:'+size+'px;height:'+size+'px"><svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" aria-hidden="true">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="10"/>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="10" stroke-linecap="round" transform="rotate(-90 '+size/2+' '+size/2+')" stroke-dasharray="'+C.toFixed(2)+'" stroke-dashoffset="'+(C*(1-score/100)).toFixed(2)+'"/></svg>'+
    '<div class="n"><div><b>'+score+'</b><small>'+esc(L().outOf)+'</small></div></div></div>';
}
function scoreCard(kicker,score,tier,txt){ return '<section class="card"><div class="kicker">'+esc(kicker)+'</div><div class="scorecard">'+ring(score,tier,112)+'<div><span class="pill t-'+tier+'">'+esc(txt[0])+'</span><h3>'+esc(txt[1])+'</h3><p>'+esc(txt[2])+'</p></div></div></section>'; }
function stat(label,sub,val,neg){ return '<div class="stat"><div class="k">'+esc(label)+'<small>'+esc(sub)+'</small></div><div class="v'+(neg?" neg":"")+'">'+val+'</div></div>'; }
function compute(){
  var a=Object.assign({},st.a);
  if(st.flow==="both"){ a.s_next="here"; a.b_own="sell"; a.b_when=a.s_when; }
  var out={a:a};
  if(st.flow!=="buy") out.s=seller(a);
  if(st.flow!=="sell") out.b=buyer(a, st.flow==="both"?Math.max(0,out.s.netLo):0);
  return out;
}

function submitLead(R,needAddr){
  var t=L(), g=function(id){var el=document.getElementById(id);return el?el.value.trim():"";};
  var n=g("lname"), em=g("lemail"), ph=g("lphone"), ad=g("laddr"), ok=document.getElementById("lconsent").checked, err=document.getElementById("lerr");
  if(!n){ err.textContent=t.errName; document.getElementById("lname").focus(); return; }

        editAgentPhoto(cv.toDataURL("image/jpeg",0.86),{cx:.5,cy:(cv.height>cv.width*1.15?.3:.45),z:1}); return;

/* Read any picked file into a data URL no bigger than max pixels on its long side */
function fileToData(file,max,cb){
  var r=new FileReader();
  r.onload=function(){ var img=new Image(); img.onload=function(){ var sc=Math.min(1,max/Math.max(img.width,img.height)), cv=document.createElement("canvas");
      cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); cb(cv.toDataURL("image/jpeg",0.88)); };
    img.onerror=function(){ toast("That file didn't open as an image. Try a JPG or PNG."); }; img.src=r.result; };
  r.readAsDataURL(file);
}

/* Crop box in photo pixels. Zoom below 1 makes the photo smaller than the frame; then it can
   move anywhere inside the frame, and the empty space is filled with the photo's edge color. */
function clampC(v,lo,hi){ return lo<=hi ? Math.max(lo,Math.min(hi,v)) : Math.max(hi,Math.min(lo,v)); }
function cropBox(W,H,A,c){ var bh=Math.min(H,W/A)/c.z, bw=bh*A, cx=clampC(c.cx*W,bw/2,W-bw/2), cy=clampC(c.cy*H,bh/2,H-bh/2); return {x:cx-bw/2,y:cy-bh/2,w:bw,h:bh,cx:cx/W,cy:cy/H}; }
function edgeColor(img){ if(img._edge) return img._edge; try{ var n=16, cv=document.createElement("canvas"); cv.width=n; cv.height=n; var x=cv.getContext("2d"); x.drawImage(img,0,0,n,n);
    var d=x.getImageData(0,0,n,n).data, r=0,g=0,b=0,k=0; for(var i=0;i<n;i++) for(var j=0;j<n;j++){ if(i&&j&&i<n-1&&j<n-1) continue; var o=(j*n+i)*4; r+=d[o]; g+=d[o+1]; b+=d[o+2]; k++; }
    img._edge="rgb("+Math.round(r/k)+","+Math.round(g/k)+","+Math.round(b/k)+")"; }catch(e){ img._edge="#1c2027"; } return img._edge; }
function cropOut(img,A,c,outW,outH,q){ var W=img.naturalWidth, H=img.naturalHeight, b=cropBox(W,H,A,c), k=outW/b.w, cv=document.createElement("canvas"); cv.width=outW; cv.height=outH;
  var ctx=cv.getContext("2d"); ctx.fillStyle=edgeColor(img); ctx.fillRect(0,0,outW,outH); ctx.imageSmoothingQuality="high"; ctx.drawImage(img,-b.x*k,-b.y*k,W*k,H*k); return cv.toDataURL("image/jpeg",q||0.88); }

function openCropper(o){
  var img=new Image(), st2={cx:(o.crop&&o.crop.cx!=null)?o.crop.cx:.5,cy:(o.crop&&o.crop.cy!=null)?o.crop.cy:.45,z:(o.crop&&o.crop.z)||1}, frame=o.frame||"circle", back=document.activeElement;

    (o.frames?'<p style="font-weight:700;margin:12px 0 0">Pick a frame <span class="opt-l" style="font-weight:400">(shows on your Formal page)</span></p><div class="crop-frames" id="cropFrames"></div>':'')+
    '<div class="crop-acts"><button type="button" class="btn" id="cropSave">Save photo</button><button type="button" class="btn ghost" id="cropCancel">Cancel</button></div>'+
    (o.onNew?'<p style="margin:12px 0 0;text-align:center"><label class="linkbtn" for="cropNew" style="cursor:pointer">Use a different photo</label><input type="file" id="cropNew" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0"></p>':'')+'</div>';
  document.body.appendChild(ov); document.body.style.overflow="hidden";
  var win=ov.querySelector("#cropWin"), im=ov.querySelector("#cropImg"), zr=ov.querySelector("#cropZ"), view={k:1};
  function aspect(){ return o.frames?frameById(frame)[2]:(o.aspect||1); }
  function draw(){
    if(!img.naturalWidth) return;
    var A=aspect(), W=img.naturalWidth, H=img.naturalHeight, maxW=Math.min(o.frames?240:420, ov.querySelector("#cropStage").clientWidth-24), maxH=o.frames?300:300;
    var ww=Math.min(maxW,maxH*A), wh=ww/A;

    win.style.background=edgeColor(img);

    box.innerHTML=FRAMES.map(function(f){ var A=f[2], W=img.naturalWidth, H=img.naturalHeight, b=cropBox(W,H,A,st2), tw=f[2]<1?44:50, th=tw/A, k=tw/b.w;
      return '<button type="button" data-fr="'+f[0]+'" aria-pressed="'+(frame===f[0])+'"><span class="pf pf-'+f[0]+'" style="background:'+edgeColor(img)+';width:'+tw+'px;height:'+th+'px;border-width:2px;box-shadow:none;outline-offset:3px;'+(f[0]==="arch"?'border-radius:'+(tw/2)+'px '+(tw/2)+'px 3px 3px;':'')+'"><img src="'+o.src+'" alt="" style="position:absolute;max-width:none;width:'+(W*k)+'px;height:'+(H*k)+'px;left:'+(-b.x*k)+'px;top:'+(-b.y*k)+'px"></span>'+esc(f[1])+'</button>'; }).join("");

  var drag=null;
  win.addEventListener("pointerdown",function(e){ drag={x:e.clientX,y:e.clientY,cx:st2.cx,cy:st2.cy}; win.classList.add("drag"); try{ win.setPointerCapture(e.pointerId); }catch(_){} e.preventDefault(); });

  function close(){ document.removeEventListener("keydown",onKey); ov.remove(); document.body.style.overflow=""; if(back&&back.focus) try{ back.focus(); }catch(_){} }

function setupWheel(){
  var cv=document.getElementById("wheelCv"), ctx=cv.getContext("2d"), mk=document.getElementById("wheelMk"), R=120;
  var valR=document.getElementById("valR"), hexIn=document.getElementById("hexIn");
  var rgb=hexToRgb(settings.color); hsv=rgbToHsv(rgb[0],rgb[1],rgb[2]);
  function draw(){
    var img=ctx.createImageData(240,240), d=img.data;
    for(var y=0;y<240;y++) for(var x=0;x<240;x++){
      var dx=x-R+0.5, dy=y-R+0.5, dist=Math.sqrt(dx*dx+dy*dy), i=(y*240+x)*4;
      if(dist>R){ d[i+3]=0; continue; }
      var h=(Math.atan2(dy,dx)*180/Math.PI+360)%360, c=hsvToRgb(h,dist/R,hsv[2]);
      d[i]=c[0]; d[i+1]=c[1]; d[i+2]=c[2]; d[i+3]= dist>R-1 ? Math.round((R-dist)*255) : 255;
    }
    ctx.putImageData(img,0,0);
  }
  function place(){ var a=hsv[0]*Math.PI/180; mk.style.left=(R+Math.cos(a)*hsv[1]*R)+"px"; mk.style.top=(R+Math.sin(a)*hsv[1]*R)+"px"; mk.style.background=settings.color; }
  function sync(fromHex){
    if(!fromHex) settings.color=rgbToHex.apply(null,hsvToRgb(hsv[0],hsv[1],hsv[2]));
    hexIn.value=settings.color.toUpperCase(); valR.value=Math.round(hsv[2]*100);
    applyBrand(); place();
    var cr=contrastWhite(settings.color);
    document.getElementById("cMsg").textContent = cr>=4.5 ? "Easy to read with white text." : "This color is light, so buttons will use dark text.";
    document.querySelectorAll("#sws .sw").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-c").toLowerCase()===settings.color.toLowerCase()); });
  }
  function pick(e){ var r=cv.getBoundingClientRect(), dx=e.clientX-r.left-R, dy=e.clientY-r.top-R;
    hsv[0]=(Math.atan2(dy,dx)*180/Math.PI+360)%360; hsv[1]=Math.min(1,Math.sqrt(dx*dx+dy*dy)/R); if(hsv[2]<0.15) hsv[2]=0.6; sync(); }
  var dragging=false;
  cv.addEventListener("pointerdown",function(e){ dragging=true; try{cv.setPointerCapture(e.pointerId);}catch(_){} pick(e); });
  cv.addEventListener("pointermove",function(e){ if(dragging) pick(e); });
  var end=function(){ if(dragging){ dragging=false; saveSettings(); kitDirty=true; } };
  cv.addEventListener("pointerup",end); cv.addEventListener("pointercancel",end);
  valR.addEventListener("input",function(){ hsv[2]=valR.value/100; draw(); sync(); });
  valR.addEventListener("change",function(){ saveSettings(); kitDirty=true; });
  hexIn.addEventListener("change",function(){ var v=hexIn.value.trim(); if(v.charAt(0)!=="#") v="#"+v;
    if(validHex(v)){ settings.color=v.toLowerCase(); var c=hexToRgb(v); hsv=rgbToHsv(c[0],c[1],c[2]); draw(); sync(true); saveSettings(); kitDirty=true; } else { toast("Use a 6-digit color code, like #1E3A5F"); sync(true); } });
  document.querySelectorAll("#sws .sw").forEach(function(b){ b.addEventListener("click",function(){ settings.color=b.getAttribute("data-c"); var c=hexToRgb(settings.color); hsv=rgbToHsv(c[0],c[1],c[2]); draw(); sync(true); saveSettings(); kitDirty=true; }); });
  document.getElementById("themeSave").addEventListener("click",function(){
    var n=document.getElementById("themeName").value.trim()||("Theme "+(settings.themes.length+1));
    settings.themes=settings.themes.filter(function(x){return x.name!==n;});
    settings.themes.unshift({name:n,color:settings.color,layout:settings.layout}); settings.themes=settings.themes.slice(0,8);
    saveSettings(); document.getElementById("themeName").value=""; renderThemes(); toast("Theme saved");
  });
  draw(); sync(true);
}
function renderThemes(){
  var box=document.getElementById("themeList"); if(!box) return;
  box.innerHTML = settings.themes.length ? settings.themes.map(function(t,i){ return '<span class="theme"><button type="button" class="apply" data-i="'+i+'"><i style="background:'+esc(t.color)+'"></i>'+esc(t.name)+'</button><button type="button" class="del" data-d="'+i+'" aria-label="Delete '+esc(t.name)+'">×</button></span>'; }).join("") : '<span class="opt-l" style="font-size:14px">No saved themes yet.</span>';

 {"en": {"k": "Texas homeowners", "h": "Did you file your homestead exemption?", "s": "It can lower the taxable value of your home. Filing with your county is free.", "hook": "Bought a home in Texas? Don't miss this tax break.", "body": "A homestead exemption can lower the taxable value of the home you live in. You file it with your county appraisal district, and filing is free, so there's no need to pay a company to do it. Ask me if you're not sure where to start.", "beats": ["Own and live in your Texas home?", "A homestead exemption can lower its taxable value.", "File with your county appraisal district. It's free."], "cta": "Ask me how", "pin": "Texas Homestead Exemption: What Homeowners Should Know", "tags": "#HomesteadExemption #TexasHomeowner #{cityTag}"}, "es": {"k": "Dueños de casa en Texas", "h": "¿Ya pediste tu exención de homestead?", "s": "Puede bajar el valor gravable de tu casa. Pedirla en tu condado es gratis.", "hook": "¿Compraste casa en Texas? No te pierdas este ahorro en impuestos.", "body": "La exención de homestead puede bajar el valor gravable de la casa donde vives. Se pide en el distrito de avalúo de tu condado y es gratis, así que no necesitas pagarle a una compañía. Pregúntame si no sabes por dónde empezar.", "beats": ["¿Eres dueño y vives en tu casa en Texas?", "La exención de homestead puede bajar su valor gravable.", "Pídela en el distrito de avalúo de tu condado. Es gratis."], "cta": "Pregúntame cómo", "pin": "Exención de homestead en Texas: lo que debes saber", "tags": "#Homestead #DueñosDeCasa #Texas"}},
 {"en": {"k": "Before you shop", "h": "Pre-qualified or pre-approved?", "s": "They sound alike, but sellers take one more seriously.", "hook": "Pre-qualified and pre-approved are not the same thing.", "body": "A pre-qualification is a quick estimate. A pre-approval means a lender has checked your income, assets and credit, which makes your offer stronger. Start with my free check, then I'll connect you with a lender.", "beats": ["Pre-qualified: a quick estimate.", "Pre-approved: a lender checked your income, assets and credit.", "Sellers take pre-approved offers more seriously."], "cta": "Get started", "pin": "Pre-Qualified vs. Pre-Approved: What's the Difference?", "tags": "#PreApproval #HomeBuyingTips #FirstTimeHomeBuyer"}, "es": {"k": "Antes de buscar", "h": "¿Precalificado o preaprobado?", "s": "Suenan parecido, pero los vendedores toman más en serio uno.", "hook": "Precalificado y preaprobado no son lo mismo.", "body": "Una precalificación es un cálculo rápido. Una preaprobación significa que un prestamista revisó tus ingresos, ahorros y crédito, y eso hace tu oferta más fuerte. Empieza con mi prueba gratis y luego te conecto con un prestamista.", "beats": ["Precalificado: un cálculo rápido.", "Preaprobado: un prestamista revisó tus ingresos, ahorros y crédito.", "Los vendedores toman más en serio una oferta preaprobada."], "cta": "Empieza aquí", "pin": "Precalificado vs. preaprobado: ¿cuál es la diferencia?", "tags": "#Preaprobacion #CompradoresDeCasa"}},
 {"en": {"k": "Seller tip", "h": "Price it right from day one", "s": "The first two weeks get the most attention from buyers.", "hook": "The first two weeks on the market matter most. Here's why.", "body": "A new listing gets the most views and showings right away. Pricing it well from the start, based on recent sales nearby, helps you make the most of that window. My free seller check is a good first step.", "beats": ["New listings get the most attention in the first weeks.", "Price it well from the start, based on recent sales nearby.", "Start with your free estimated value and net."], "cta": "See your home's value", "pin": "Why Pricing Your Home Right From Day One Matters", "tags": "#HomeSellers #PricingYourHome #{cityTag}Homes"}, "es": {"k": "Consejo para vender", "h": "Ponle buen precio desde el primer día", "s": "Las primeras dos semanas reciben más atención de los compradores.", "hook": "Las primeras dos semanas en el mercado son las más importantes. Te explico.", "body": "Una casa recién publicada recibe más vistas y visitas al principio. Ponerle un buen precio desde el inicio, basado en ventas recientes cerca, te ayuda a aprovechar ese momento. Mi prueba gratis para vendedores es un buen primer paso.", "beats": ["Las casas nuevas en el mercado reciben más atención al inicio.", "Ponle buen precio desde el principio, según ventas cercanas.", "Empieza con tu valor y ganancia aproximados, gratis."], "cta": "Ve el valor de tu casa", "pin": "Por qué importa ponerle buen precio a tu casa desde el inicio", "tags": "#VenderCasa #Casas{cityTag}"}},

/* Phone calendar reminders: one 15-minute event at 9:00 AM on each posting day */
function calIcs(){
  if(!cal||!cal.items) return;
  var today=ymd(new Date()), esc2=function(t){ return String(t).replace(/\\/g,"\\\\").replace(/;/g,"\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n"); };
  var stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z"), link="https://www.2buyandsell.com/dashboard#cal";
  var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//2BuyAndSell//Post calendar//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:My posting days"];
  cal.items.filter(function(x){ return x.d>=today && !x.done; }).forEach(function(x){ var d=x.d.replace(/-/g,"");
    L.push("BEGIN:VEVENT","UID:post-"+d+"-"+x.p+"@2buyandsell.com","DTSTAMP:"+stamp,"DTSTART:"+d+"T090000","DTEND:"+d+"T091500",
      "SUMMARY:"+esc2("Post today: "+postTitle(x)+" ("+x.l.toUpperCase()+")"),
      "DESCRIPTION:"+esc2("Open your Post calendar to copy the caption and open the app in one tap: "+link),"URL:"+link,
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+esc2("Time to post"),"TRIGGER:PT0M","END:VALARM","END:VEVENT"); });
  L.push("END:VCALENDAR");
  var blob=new Blob([L.join("\r\n")+"\r\n"],{type:"text/calendar"}), u=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=u; a.download="my-posting-days.ics"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(u); },4000);

  if(s<86400){ var hr=Math.round(s/3600); return hr+(hr===1?" hr ago":" hrs ago"); }
  var d=Math.round(s/86400); return d===1?"Yesterday":d<7?d+" days ago":new Date(iso).toLocaleDateString("en-US",{month:"short",day:"numeric"}); }
